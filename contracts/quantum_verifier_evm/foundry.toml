[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Reproducible bytecode: no metadata hash, no CBOR trailer. This makes the
# deployed bytecode a pure function of the source, which is what we want for
# CREATE2 determinism and for publishing a verifiable bytecode hash.
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 256, depth = 32 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
