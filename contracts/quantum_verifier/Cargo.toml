[package]
name = "quantum_verifier"
version = "0.1.0"
edition = "2021"
description = "On-chain claim verifier for Quantum-Verification-as-a-Service on Stellar/Soroban"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=23.0.1"

[dev-dependencies]
soroban-sdk = { version = "=23.0.1", features = ["testutils"] }

# Force the whole soroban ecosystem to 23.0.1 so that
# soroban-env-host doesn't pull in ed25519-dalek 3.0.0
# (which breaks the test RNG on macOS).
soroban-env-host = "=23.0.1"
soroban-ledger-snapshot = "=23.0.1"
soroban-env-common = "=23.0.1"
soroban-env-guest = "=23.0.1"
soroban-env-macros = "=23.0.1"
soroban-sdk-macros = "=23.0.1"
soroban-spec = "=23.0.1"
soroban-spec-rust = "=23.0.1"

# Force ed25519-dalek to stay in the 2.x line. The crate's official
# repo doesn't tag 2.x, so we use Cargo's path-replacement via a
# vendored copy. Until we have a vendor/ directory, we override via
# `cargo update -p ed25519-dalek --precise 2.2.0` (run after the first
# `cargo update`). This is the same workaround used by ed25519-dalek
# 2.x consumers who can't move to the 3.x rand_api split.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = true
